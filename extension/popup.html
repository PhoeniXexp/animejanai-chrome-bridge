<!doctype html>
<html lang="ru"><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<title>AnimeJaNai</title><h1>AnimeJaNai</h1>
<p>Откройте видео в AnimeJaNai с текущего момента −5 сек.</p>
<button id="refresh" title="Показать потоки, найденные после открытия этого окна. Обычно список обновляется при открытии расширения.">Обновить список</button>
<div id="items"></div>
<p id="status" role="status"></p>
<details><summary>Настройки</summary>
<button id="clear" title="Удалить найденные ссылки этой вкладки. Используйте, если список устарел; затем перезапустите видео на сайте.">Очистить список</button>
<p>Укажите адрес сайта. Плеер и CDN определяются автоматически. Chrome запросит доступ к HTTPS-сайтам для обнаружения неизвестных CDN; расширение обрабатывает только настроенные страницы.</p>
<p><label><input type="checkbox" id="autoCapture" checked>Запоминать потоки автоматически на настроенных сайтах</label></p>
<label>Сайты (адрес страницы или домен, по одному в строке)<textarea id="sites" placeholder="https://animego.online/..."></textarea></label>
<button id="save">Сохранить сайт</button>
<button id="connection">Проверить подключение к плееру</button>
<button id="revoke">Отозвать доступ и забыть настройки</button></details>
<script type="module" src="popup.js"></script></html>
