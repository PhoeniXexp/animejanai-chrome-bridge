<!doctype html>
<html lang="ru"><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<title>AnimeJaNai</title><h1>AnimeJaNai</h1>

<div id="items"></div>
<p id="status" role="status"></p>
<details><summary>Настройки</summary>
<button id="clear" title="Удалить найденные потоки этой вкладки.">Очистить список</button>
<p>Доступ запрашивается к HTTPS-сайтам; поиск работает только на указанных ниже.</p>
<p><label><input type="checkbox" id="autoCapture" checked>Находить потоки автоматически</label></p>
<label>Сайты — по одному в строке<textarea id="sites" placeholder="https://animego.online/..."></textarea></label>
<button id="save">Сохранить</button>
<button id="connection">Проверить подключение</button>
<button id="revoke">Сбросить доступ и настройки</button></details>
<script type="module" src="popup.js"></script></html>
